<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · THYSMY</title>
  <link rel="stylesheet" href="/static/v3.css">
</head>
<body>
<main class="authWrap">
  <a class="back" href="/">← THYSMY</a>
  <section class="authCard">
    <h1>Login</h1>
    <p>Access your dashboard.</p>

    <form id="form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="loginBtn" class="btn" type="submit">Login</button>
    </form>

    <div id="msg" class="msg"></div>
    <p class="small">No account? <a href="/register">Register</a></p>
  </section>
</main>
<script src="/static/auth.js"></script>
</body>
</html>
